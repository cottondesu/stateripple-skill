name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build deterministic package
        run: make build
      - name: Validate contracts and catalogs
        run: make check
      - name: Run unit tests
        run: make test
      - name: Verify release hygiene and package integrity
        run: make release-check
